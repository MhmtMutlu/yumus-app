<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages serves this page for any missing path, so relative links resolve from the site root.
     base_path comes from src/site.json; set it to "/" when a custom domain is added. -->
<base href="{{base_path}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#F7F2EC">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/site.css?v={{css_version}}">
</head>
<body class="{{body_class}}">
<a class="skip-link" href="#main">{{skip}}</a>
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="./">
      <img class="brand__icon" src="assets/img/app-icon.webp" width="40" height="40" alt="">
      <span class="brand__name">{{app}}</span><span class="visually-hidden">, {{home_label}}</span>
    </a>
  </div>
</header>
<main id="main" tabindex="-1">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap site-footer__inner site-footer__inner--compact">
    <div class="site-footer__legal">
      <p>© {{year}} {{company}}</p>
    </div>
  </div>
</footer>
</body>
</html>
